<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>example-vite-in-process</title>
    <!-- Elm, compiled by elm-watch. A plain script tag (no type="module"), so
    Vite leaves it alone. The file is in public/, which Vite copies as-is when
    building for production. -->
    <script src="/build/main.js"></script>
    <!-- TypeScript and CSS, handled by Vite. -->
    <script type="module" src="/ts/main.ts"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
