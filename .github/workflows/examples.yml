name: Examples

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  main:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        example:
          - minimal
          - javascript-api
          - production
          - application-proxy

    defaults:
      run:
        working-directory: examples/${{ matrix.example }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # Build elm-watch so we can use it in the examples.
      # In your own project, you would install elm-watch from npm instead.
      - name: Internal cache node_modules
        id: internal-cache-node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: internal-node_modules-ubuntu-latest-26-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Internal npm ci
        if: steps.internal-cache-node_modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit
        working-directory: .
      - name: Internal build
        run: npm run build
        working-directory: .

      - name: Cache node_modules
        id: cache-node_modules
        uses: actions/cache@v6
        with:
          path: examples/${{ matrix.example }}/node_modules
          key: node_modules-${{ matrix.example }}-${{ hashFiles(format('examples/{0}/package.json', matrix.example), format('examples/{0}/package-lock.json', matrix.example)) }}

      - name: Cache ~/.elm
        uses: actions/cache@v6
        with:
          path: ~/.elm
          key: elm-${{ hashFiles(format('examples/{0}/elm.json', matrix.example)) }}

      - if: steps.cache-node_modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit

      - run: npm run build

      - run: npm run check --if-present

      - run: npx elm-format --validate src
